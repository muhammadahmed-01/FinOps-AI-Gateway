[project]
name = "finops-gateway"
version = "0.1.0"
description = "Observable, cost-routing AI gateway with hybrid RAG over LangGraph/LangChain docs"
readme = "README.md"
authors = [
    { name = "Muhammad Ahmed", email = "muhammad.ahmed112719@gmail.com" }
]
requires-python = ">=3.11,<3.14"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "httpx>=0.28.1",
    "langchain>=1.3.2",
    "langchain-anthropic>=1.4.4",
    "langchain-core>=1.4.0",
    "langchain-groq>=1.1.2",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.2.2",
    "langsmith>=0.8.6",
    "pgvector>=0.4.2",
    "prometheus-client>=0.25.0",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=5.5.1",
]

[project.scripts]
finops-trace-smoke = "finops_gateway.scripts.trace_smoke:main"
finops-ingest-langgraph = "finops_gateway.scripts.ingest_langgraph_docs:main"
finops-query-rag = "finops_gateway.scripts.query_rag:main"
finops-query-gateway = "finops_gateway.scripts.query_gateway:main"
finops-demo-tiers = "finops_gateway.scripts.demo_tiers:main"
finops-metrics-serve = "finops_gateway.scripts.metrics_server:main"

[build-system]
requires = ["uv_build>=0.11.17,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
]
